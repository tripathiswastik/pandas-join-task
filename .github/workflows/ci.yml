name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pytest pytest-json-ctrf pandas==2.2.2 numpy==1.26.4

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Type check with mypy
      run: |
        mypy solution/pipeline.py tests/test_outputs.py build_release.py

    - name: Execute reference solution
      run: |
        python solution/solve.py

    - name: Run verification test suite
      run: |
        pytest tests/test_outputs.py -v
        pytest tests/test_mutated_case.py -v
